name: tests

# Runs on the Forgejo mirror at git.intil.li, not on GitHub. The mirror syncs
# on every GitHub push and only ever sees pushes, so there is no pull_request
# trigger: every branch is tested on push, and the result is reported back to
# the commit on GitHub as a status. The nightly schedule only fires for the
# mirror's default branch.
on:
  push:
  schedule:
    - cron: '0 0 * * *'

jobs:
  php-tests:
    # Forgejo runners are Linux only, so there is no os matrix: no Windows or
    # macOS jobs. ubuntu-latest is the runner's own image, not GitHub's.
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ 8.4, 8.3, 8.2 ]
        laravel: [ 13.*, 12.*, 11.* ]
        dependency-version: [ prefer-lowest, prefer-stable ]
        guzzle: [ '^8.0', '^7.8' ]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*
          - laravel: 11.*
            testbench: 9.*
        exclude:
          # Laravel 13 needs PHP 8.3
          - php: 8.2
            laravel: 13.*

          # Laravel 11's lowest dependency set does not resolve on PHP 8.2+
          - laravel: 11.*
            dependency-version: prefer-lowest

          # Laravel 11 and 12 cap Guzzle at 7. Laravel 13 allows 8, and a new
          # Laravel 13 application ships with it.
          - laravel: 12.*
            guzzle: '^8.0'
          - laravel: 11.*
            guzzle: '^8.0'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - G${{ matrix.guzzle }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Only the extensions the package and its tests use. The runner image is
      # not GitHub's, so extensions that need system libraries (imagick, gd,
      # intl, soap) would have to be built here for nothing. No coverage
      # driver either: the suite runs without coverage.
      #
      # Every job installs PHP at the same moment on the one runner, and now and
      # then that install fails before any test runs. Retried twice, after a
      # pause, rather than failing the job on something the code did not do.
      - name: Setup PHP
        id: setup-php
        continue-on-error: true
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Wait before setting up PHP again
        if: steps.setup-php.outcome == 'failure'
        run: sleep 30

      - name: Setup PHP (second attempt)
        id: setup-php-again
        if: steps.setup-php.outcome == 'failure'
        continue-on-error: true
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Wait before setting up PHP a last time
        if: steps.setup-php-again.outcome == 'failure'
        run: sleep 60

      - name: Setup PHP (last attempt)
        if: steps.setup-php-again.outcome == 'failure'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      # Composer 2.11 refuses to install any release with a security advisory,
      # and every Laravel 11 release has one, so 11.* would not resolve at all.
      # The matrix tests the versions composer.json claims to support; which of
      # them an application may install is that application's call.
      - name: Install dependencies
        run: |
          composer config --global policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "guzzlehttp/guzzle:${{ matrix.guzzle }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit
